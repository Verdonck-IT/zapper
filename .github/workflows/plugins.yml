name: Plugins publiceren

# Bouwt elke plugin, zet ze om naar DEX, signeert de index en publiceert naar de dist-site.
# De app op de TV pikt nieuwe builds op bij de volgende onderhoudsrun (of via Instellingen).
on:
  push:
    branches: [main]
    paths: ["plugins/**", "provider-api/**", "tools/publish/**"]
  workflow_dispatch:

concurrency: publish-dist

env:
  PROVIDER_API_VERSION: 4 # moet gelijk zijn aan PROVIDER_API_VERSION in provider-api

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh-pages pushen met github.token (als er geen DIST_TOKEN is)
    env:
      # Zonder signeersleutel wordt er enkel gebouwd en getest, niet gepubliceerd.
      HAS_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Build-tools en platform voor d8
        run: sdkmanager "build-tools;35.0.0" "platforms;android-35"

      - name: Plugins bouwen + unit tests
        run: ./gradlew test $(for d in plugins/*/; do n=$(basename $d); echo ":plugins:$n:jar :plugins:$n:dexClasspath"; done)

      - name: Naar DEX converteren
        run: |
          mkdir -p build/dex
          D8="$ANDROID_HOME/build-tools/35.0.0/d8"
          for d in plugins/*/; do
            n=$(basename "$d")
            cp_args=$(for j in "$d"build/dex-classpath/*.jar; do echo --classpath "$j"; done)
            "$D8" --release --min-api 26 \
              --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
              $cp_args \
              --output "build/dex/$n.jar" \
              "$d"build/libs/*.jar
            echo "$n: $(stat -c%s build/dex/$n.jar) bytes"
          done

      - name: Publiceren overgeslagen (geen signeersleutel)
        if: env.HAS_SIGNING_KEY != 'true'
        run: |
          echo "::notice title=Plugins niet gepubliceerd::Secret PLUGIN_SIGNING_KEY ontbreekt. Plugins zijn gebouwd, getest en naar DEX omgezet, maar niet gepubliceerd. Maak een sleutel met tools/signing/keygen.py (zie README)."

      - name: Dist-site uitchecken (gh-pages; wordt aangemaakt als ze nog niet bestaat)
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          TOKEN: ${{ secrets.DIST_TOKEN || github.token }}
          REPO: ${{ vars.DIST_REPO || github.repository }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$url" gh-pages >/dev/null; then
            git clone --quiet --depth 1 --branch gh-pages "$url" dist
          else
            git init --quiet dist
            git -C dist checkout --quiet --orphan gh-pages
            git -C dist remote add origin "$url"
          fi

      - if: env.HAS_SIGNING_KEY == 'true'
        run: pip install cryptography

      - name: Publiceren en signeren
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
        run: |
          for d in plugins/*/; do
            n=$(basename "$d")
            python tools/publish/publish_plugin.py \
              --properties "$d/src/main/resources/zapper-plugin.properties" \
              --dex "build/dex/$n.jar" \
              --build "${{ github.run_number }}" \
              --api-version "$PROVIDER_API_VERSION" \
              --dist dist
          done

      - name: Pushen
        if: env.HAS_SIGNING_KEY == 'true'
        working-directory: dist
        run: |
          git config user.name "zapper-ci"
          git config user.email "zapper-ci@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Niets gewijzigd"; exit 0; }
          git commit -m "plugins: build ${{ github.run_number }} (${{ github.sha }})"
          git push origin gh-pages
